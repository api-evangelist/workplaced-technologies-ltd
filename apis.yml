description: Workplaced (Workplaced Technologies Ltd) is a workplace-strategy and hybrid-work
  SaaS platform that helps companies create workplaces that work. Its products cover workplace
  experience surveys (Dynamics), office occupancy measurement beyond sensor data (Occupancy),
  space taxonomy and office planning (Taxonomy), desk and meeting-room booking (Booking), and
  hybrid work policy modelling (Balance), alongside a pricing calculator, free planning tools,
  research reports, and a partner program. Workplaced is a 500 Global portfolio company. It
  publishes no public developer program - the api.workplaced.com backend is fully
  authentication-gated with no public documentation or specification.
